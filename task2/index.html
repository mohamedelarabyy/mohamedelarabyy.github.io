<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table</title>
  <style>
    table { border: 2px solid black; border-collapse: separate; border-spacing: 6px; }
    td, th { border: 1px solid gray; padding: 12px; text-align: center; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th colspan="2">name</th>
      <th rowspan="2">Address</th>
    </tr>
    <tr>
      <th>First</th>
      <th>Last</th>
    </tr>
    <tr>
      <td colspan="3" style="background:green;">All the data is here</td>
    </tr>
    <tr>
      <td colspan="2" rowspan="2">Hamada</td>
      <td style="color:red;">cairo</td>
    </tr>
    <tr>
      <td>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis</td>
    </tr>
  </table>
</body>
</html>
